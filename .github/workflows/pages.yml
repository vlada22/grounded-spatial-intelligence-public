name: Deploy public reconstruction explorer

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - "scripts/validate_public_bundle.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate public bundle
        run: python scripts/validate_public_bundle.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload original explorer mirror
        uses: actions/upload-pages-artifact@v4
        with:
          path: demo

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
