name: Copy exact original Article 02 demo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mirror-original-demo.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v6

      - name: Clone original repository
        run: git clone --depth 1 https://github.com/vlada22/grounded-spatial-intelligence.git /tmp/original

      - name: Copy exact demo folder
        run: |
          rm -rf demo
          cp -a /tmp/original/demo ./demo

      - name: Commit exact copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A demo
          if git diff --cached --quiet; then
            echo "Article 02 demo already matches the original exactly."
            exit 0
          fi
          git commit -m "Copy exact original Article 02 demo"
          git push
